# Adapted from https://github.com/eclipse-theia/theia-ide/blob/74bd976ef60102bdbaf754817c88d00811465e72/.github/workflows/build.yml
name: Build, package and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.typ"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.typ"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  check:
    name: Lint and E2E browser tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: yarn

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: yarn --frozen-lockfile --skip-integrity-check --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: yarn lint

      - name: Build (dev)
        run: yarn build:dev

      - name: Cache Theia plugins
        uses: actions/cache@v5
        with:
          path: plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Download plugins
        run: yarn download:plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Chromium
        run: cd tests && npx playwright install --with-deps chromium

      - name: Run Yukibana
        run: |
          yarn browser start &
          # Wait for the server.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Server did not start in time" >&2
          exit 1

      - name: Test (playwright browser)
        run: yarn tests ui-tests-ci

      - name: Generate report
        run: yarn tests ui-tests-report-generate

      - name: Upload test results (browser)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-tests-browser
          path: |
            test-results/
            tests/allure-results/
          if-no-files-found: ignore
          retention-days: 5

  package:
    name: Package (${{ matrix.artifact }})
    if: github.event_name != 'pull_request'
    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, artifact: windows }
          - { os: ubuntu-22.04, artifact: linux }
          - { os: macos-15, artifact: mac-arm64 }
          - { os: macos-15-intel, artifact: mac-x64 }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: yarn

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: yarn --frozen-lockfile --skip-integrity-check --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Theia plugins
        uses: actions/cache@v5
        with:
          path: plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.os }}-

      - name: Update electron-builder.yml for macos-15
        if: matrix.os == 'macos-15'
        run: |
          sed -i '' 's|https://yukibana.isc-vs.ch/download/latest/macos|https://yukibana.isc-vs.ch/download/latest/macos-arm|g' electron-app/electron-builder.yml

      - name: Build prod package
        shell: bash
        run: |
          yarn build
          yarn download:plugins
          yarn package:applications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist files
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron-app/dist/**
            !electron-app/dist/*-unpacked/**
            !electron-app/dist/mac/**
            !electron-app/dist/mac-arm64/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
