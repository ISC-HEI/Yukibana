saveExact: true
linkWorkspacePackages: true
nodeLinker: hoisted # Needed for Theia's version check
packages:
  - packages/*
  - theia-extensions/*
  - browser-app
  - electron-app
  - tests
allowBuilds:
  "@parcel/watcher": true
  "@theia/ffmpeg": true
  "@vscode/windows-ca-certs": true
  "@yukibana/cli@https://codeload.github.com/tothambrus11/yukibana-cloud/tar.gz/37c34436a3b1a752123ab10c89be214cbe534556#path:/cli": true
  chromedriver: true
  core-js: true
  drivelist: true
  electron-chromedriver: true
  electron-winstaller: true
  esbuild: true
  find-git-repositories: true
  keytar: true
  msgpackr-extract: true
  native-keymap: true
  node-pty: true
  # Only needed by `theia test`, which this project doesn't use; skips downloading two Chrome builds.
  puppeteer: false
