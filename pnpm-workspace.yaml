nodeVersion: "24.18.0"
saveExact: true
linkWorkspacePackages: true
nodeLinker: hoisted # Needed for Theia's version check
packages:
  - theia-extensions/*
  - browser-app
  - electron-app
  - tests
allowBuilds:
  "@parcel/watcher": true
  "@theia/ffmpeg": true
  "@vscode/windows-ca-certs": true
  "@yukibana/cli@https://codeload.github.com/tothambrus11/yukibana-cloud/tar.gz/399ba75b2a3f17f1e3534dbf7470c02ec2ba8fde#path:/cli": true
  chromedriver: true
  core-js: true
  drivelist: true
  electron-chromedriver: true
  electron-winstaller: true
  esbuild: true
  keytar: true
  msgpackr-extract: true
  native-keymap: true
  node-pty: true
  puppeteer: true
