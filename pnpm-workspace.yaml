saveExact: true
linkWorkspacePackages: true
nodeLinker: hoisted # Needed for Theia's version check
packages:
  - packages/*
  - theia-extensions/*
  - browser-app
  - electron-app
  - tests
allowBuilds:
  "@parcel/watcher": true
  "@theia/ffmpeg": true
  "@vscode/windows-ca-certs": true
  "@yukibana/cli@https://codeload.github.com/tothambrus11/yukibana-cloud/tar.gz/c47a7f3626f97aafb4518829394877fdeee7b472#path:/cli": true
  drivelist: true
  electron-winstaller: true
  esbuild: true
  keytar: true
  msgpackr-extract: true
  native-keymap: true
  node-pty: true
  # Only needed by `theia test`, which this project doesn't use; skips downloading two Chrome builds.
  puppeteer: false
