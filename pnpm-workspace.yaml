saveExact: true
linkWorkspacePackages: true
nodeLinker: hoisted # Needed for Theia's version check
packages:
  - packages/*
  - theia-extensions/*
  - dev-packages/*
  - browser-app
  - electron-app
  - tests
allowBuilds:
  "@parcel/watcher": true
  "@theia/ffmpeg": true
  "@vscode/windows-ca-certs": true
  "@yukibana/cli@https://codeload.github.com/tothambrus11/yukibana-cloud/tar.gz/b2119a13acee407dc299545e37a43c6a13a45e54#path:/cli": true
  chromedriver: true
  core-js: true
  drivelist: true
  electron-chromedriver: true
  electron-winstaller: true
  esbuild: true
  find-git-repositories: true
  keytar: true
  msgpackr-extract: true
  native-keymap: true
  node-pty: true
  puppeteer: true
