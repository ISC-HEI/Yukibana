saveExact: true
linkWorkspacePackages: true
# Resolves only versions at least 7 days old (in minutes), as Dependabot proposes them.
minimumReleaseAge: 10080
nodeLinker: hoisted # Needed for Theia's version check
packages:
  - packages/*
  - theia-extensions/*
  - browser-app
  - electron-app
  - tests
allowBuilds:
  '@parcel/watcher': true
  '@theia/ffmpeg': true
  '@vscode/windows-ca-certs': true
  '@yukibana/cli@https://codeload.github.com/tothambrus11/yukibana-cloud/tar.gz/c925ac9a77797899e0fceaa5e9858124e4bd1941#path:/cli': true
  drivelist: true
  electron-winstaller: true
  esbuild: true
  keytar: true
  msgpackr-extract: true
  native-keymap: true
  node-pty: true
  # Only needed by `theia test`, which this project doesn't use; skips downloading two Chrome builds.
  puppeteer: false
